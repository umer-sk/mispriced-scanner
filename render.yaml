services:
  - type: web
    name: mispriced-scanner-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCHWAB_APP_KEY
        sync: false
      - key: SCHWAB_APP_SECRET
        sync: false
      - key: SCHWAB_CALLBACK_URL
        value: https://127.0.0.1:8182
      - key: SCHWAB_TOKEN_PATH
        value: /etc/secrets/token.json
      - key: ALLOWED_ORIGIN
        sync: false
      # Without these two, supabase_client._get_client() returns None and every
      # save/load silently no-ops — cold starts then serve an empty cache.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
