name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          # npm ci, not npm install: installs exactly what package-lock.json
          # pins and fails loudly if the lockfile and package.json disagree.
          # npm install would silently re-resolve, so every deploy could ship
          # different dependency versions than the last one.
          npm ci
          VITE_BACKEND_URL=${{ secrets.BACKEND_URL }} npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
