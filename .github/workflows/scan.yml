name: Scheduled Scans

# Drives the backend's scans from outside.
#
# Why this exists: the backend runs on Render's free tier, which stops the
# process after ~15 min idle. An in-process scheduler (APScheduler) cannot fire
# while the process is stopped, and a cold start does not back-fill missed jobs,
# so scans only ran when somebody happened to load the site. Here the inbound
# request is what wakes the instance, so the trigger no longer depends on the
# instance already being awake.
#
# DST: GitHub cron is UTC-only, so every ET slot is listed twice — once for EDT
# (UTC-4) and once for EST (UTC-5). Only one is correct on any given date. The
# "Resolve slot" step below keys off github.event.schedule (the cron expression
# that actually fired), looks up that cron's intended ET time, and skips the run
# if the real ET clock disagrees — which is exactly what happens to the
# out-of-season half of each pair.

on:
  schedule:
    # --- 08:00 ET — pre-market scan
    - cron: '0 12 * * 1-5'    # EDT
    - cron: '0 13 * * 1-5'    # EST
    # --- 09:45 ET — sector refresh, then scan
    - cron: '45 13 * * 1-5'   # EDT
    - cron: '45 14 * * 1-5'   # EST
    # --- 10:30 ET — technical setups
    - cron: '30 14 * * 1-5'   # EDT
    - cron: '30 15 * * 1-5'   # EST
    # --- 11:00 ET — scan
    - cron: '0 15 * * 1-5'    # EDT
    - cron: '0 16 * * 1-5'    # EST
    # --- 15:45 ET — scan
    - cron: '45 19 * * 1-5'   # EDT
    - cron: '45 20 * * 1-5'   # EST
    # --- 16:15 ET — CELT scan
    - cron: '15 20 * * 1-5'   # EDT
    - cron: '15 21 * * 1-5'   # EST
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Space-separated: scan technical celt sectors'
        required: false
        default: 'scan'
        type: string

concurrency:
  group: scheduled-scans
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve slot
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_JOBS: ${{ github.event.inputs.jobs }}
        run: |
          set -euo pipefail

          if [ -z "${SCHEDULE:-}" ]; then
            echo "Manual dispatch — running: ${DISPATCH_JOBS}"
            echo "jobs=${DISPATCH_JOBS}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # cron expression -> intended ET slot, work to do, and which DST
          # season that cron belongs to.
          case "$SCHEDULE" in
            '0 12 * * 1-5')  want="08:00"; jobs="scan";         season="EDT" ;;
            '0 13 * * 1-5')  want="08:00"; jobs="scan";         season="EST" ;;
            '45 13 * * 1-5') want="09:45"; jobs="sectors scan"; season="EDT" ;;
            '45 14 * * 1-5') want="09:45"; jobs="sectors scan"; season="EST" ;;
            '30 14 * * 1-5') want="10:30"; jobs="technical";    season="EDT" ;;
            '30 15 * * 1-5') want="10:30"; jobs="technical";    season="EST" ;;
            '0 15 * * 1-5')  want="11:00"; jobs="scan";         season="EDT" ;;
            '0 16 * * 1-5')  want="11:00"; jobs="scan";         season="EST" ;;
            '45 19 * * 1-5') want="15:45"; jobs="scan";         season="EDT" ;;
            '45 20 * * 1-5') want="15:45"; jobs="scan";         season="EST" ;;
            '15 20 * * 1-5') want="16:15"; jobs="celt";         season="EDT" ;;
            '15 21 * * 1-5') want="16:15"; jobs="celt";         season="EST" ;;
            *) echo "::error::Unmapped cron '$SCHEDULE' — add it to the case block."; exit 1 ;;
          esac

          # Decide the season from the clock, NOT from how close the run landed
          # to its intended time. The first version inferred it from arrival
          # drift with a 30-minute tolerance; GitHub actually delivered these
          # crons 1.5-3.5 HOURS late, so every run was judged off-season and
          # skipped, and no scheduled scan ran at all. Tolerance can't be
          # widened past 30 min either — the twins are exactly 60 min apart.
          # The UTC offset is exact and completely immune to scheduling lag.
          case "$(TZ=America/New_York date +%z)" in
            -0400) now_season="EDT" ;;
            -0500) now_season="EST" ;;
            *) echo "::error::Unexpected ET offset $(TZ=America/New_York date +%z)"; exit 1 ;;
          esac

          echo "cron='$SCHEDULE' intended=$want $season | now=$(TZ=America/New_York date '+%H:%M %Z') ($now_season)"

          if [ "$season" != "$now_season" ]; then
            echo "Wrong DST season for this cron — skipping (its twin handles today)."
            echo "jobs=" >> "$GITHUB_OUTPUT"
          else
            # Runs even when badly delayed: a late scan is far better than none.
            echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake backend
        if: steps.slot.outputs.jobs != ''
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${BACKEND_URL%/}/health" || true)
            if [ "$code" = "200" ]; then
              echo "Backend awake after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt ${i}: HTTP ${code:-none} — cold start in progress, retrying in 15s."
            sleep 15
          done
          echo "::error::Backend did not return 200 from /health after ~3 minutes."
          exit 1

      - name: Trigger scans
        if: steps.slot.outputs.jobs != ''
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          JOBS: ${{ steps.slot.outputs.jobs }}
        run: |
          set -euo pipefail
          for job in $JOBS; do
            case "$job" in
              scan)      path="/scan" ;;
              technical) path="/scan-setups" ;;
              celt)      path="/scan-celt" ;;
              sectors)   path="/scan-sectors" ;;
              *) echo "::error::Unknown job '$job'"; exit 1 ;;
            esac

            echo "--- $job -> $path"
            body=$(curl -s -w '\n%{http_code}' --max-time 60 "${BACKEND_URL%/}${path}")
            code=$(printf '%s' "$body" | tail -n1)
            printf '%s\n' "$body" | sed '$d'

            if [ "$code" != "200" ]; then
              echo "::error::$path returned HTTP $code"
              exit 1
            fi

            # Scans run as FastAPI background tasks, so the 200 only means
            # "accepted". Space them out so a slow scan is not competing with
            # the next trigger for Schwab's 120 req/min budget.
            sleep 20
          done

      - name: Report scan freshness
        if: steps.slot.outputs.jobs != ''
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail
          # A full scan is 93 symbols paced under Schwab's rate limit, so it
          # takes ~2-3 min. Wait for it before judging the result.
          sleep 240
          curl -s --max-time 30 "${BACKEND_URL%/}/health" > health.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("health.json"))
          keys = ("status", "last_scan", "data_age_seconds", "token_age_days",
                  "scan_in_progress", "celt_last_scan", "last_scan_error")
          print(json.dumps({k: d.get(k) for k in keys}, indent=2))

          stats = d.get("last_scan_stats") or {}
          if stats:
              print(f"chains {stats.get('chains_fetched')}/{stats.get('chains_total')}, "
                    f"{stats.get('setups_passing')} passing")

          # A scan can fail without the HTTP trigger noticing — it runs as a
          # background task and the 200 only means "accepted". Fail the job so
          # this surfaces instead of sitting silently until someone looks.
          err = d.get("last_scan_error")
          if err:
              print(f"::error::Backend reported a failed scan: {err}")
              sys.exit(1)

          if d.get("token_age_days", 0) > 6:
              print("::warning::Schwab token is over 6 days old — refresh it "
                    "(python backend/auth_setup.py) before it expires at 7.")
          PY
